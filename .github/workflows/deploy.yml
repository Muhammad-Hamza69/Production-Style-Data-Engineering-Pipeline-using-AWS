name: Deploy Pipeline (AWS CLI)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: "300617413029"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8 black
      - run: flake8 lambdas dashboard --max-line-length=120
      - run: black --check lambdas dashboard

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::300617413029:role/gha-deploy-role' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run Pure AWS CLI Deployment Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          chmod +x scripts/deploy_cli.sh
          bash scripts/deploy_cli.sh

      - name: Trigger Step Functions Execution
        run: |
          aws stepfunctions start-execution \
            --state-machine-arn "arn:aws:states:${{ env.AWS_REGION }}:${{ env.AWS_ACCOUNT_ID }}:stateMachine:yt-data-pipeline" \
            --region ${{ env.AWS_REGION }}
